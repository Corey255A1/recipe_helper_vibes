services:
  recipe-helper:
    build: .
    container_name: recipe-helper
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./:/app
      - /app/node_modules
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - GEMINI_API_KEY=${GEMINI_API_KEY}
