<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="brand">
                <span class="brand-icon">🍳</span>
                <h1>Recipe Helper</h1>
            </div>
            <nav>
                <a href="/" class="nav-link" data-route="context"><span class="step-num">1</span> Preferences</a>
                <a href="#plan" class="nav-link" data-route="plan"><span class="step-num">2</span> Meal Plan</a>
                <a href="#grocery" class="nav-link" data-route="grocery"><span class="step-num">3</span> Shop</a>
            </nav>
        </div>
    </header>

    <main id="app-root" class="container">
        <!-- Content injected here by app.js -->
    </main>

    <!-- Day Selector Modal -->
    <div id="day-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Assign Days for this Meal</h3>
            <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Select the day(s) you plan to eat this meal. Multi-day selection works great for leftovers!</p>
            
            <div class="day-checkboxes">
                <label class="day-chip"><input type="checkbox" value="Monday"> <span>Mon</span></label>
                <label class="day-chip"><input type="checkbox" value="Tuesday"> <span>Tue</span></label>
                <label class="day-chip"><input type="checkbox" value="Wednesday"> <span>Wed</span></label>
                <label class="day-chip"><input type="checkbox" value="Thursday"> <span>Thu</span></label>
                <label class="day-chip"><input type="checkbox" value="Friday"> <span>Fri</span></label>
                <label class="day-chip"><input type="checkbox" value="Saturday"> <span>Sat</span></label>
                <label class="day-chip"><input type="checkbox" value="Sunday"> <span>Sun</span></label>
            </div>
            
            <div class="modal-actions" style="margin-top: 2rem; display: flex; gap: 0.5rem; justify-content: flex-end;">
                <button class="btn btn-outline" onclick="PlanView.closeDayModal()">Cancel</button>
                <button class="btn" onclick="PlanView.saveDaySelection()">Confirm & Add</button>
            </div>
        </div>
    </div>

    <!-- Recipe Details Modal -->
    <div id="recipe-modal" class="modal-overlay">
        <div class="modal-card" style="max-width: 600px; max-height: 85vh; overflow-y: auto;">
            <div id="recipe-modal-content"></div>
            <div style="margin-top: 1.5rem; text-align: right;">
                <button class="btn" onclick="PlanView.closeRecipeModal()">Close</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/loader.js"></script>
    <script src="/js/components/recipeCard.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/views/context.js"></script>
    <script src="/js/views/plan.js"></script>
    <script src="/js/views/grocery.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
